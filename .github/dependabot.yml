# Documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # gitHub actions dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

    groups:
      # matching packages that must update together
      webpack-ecosystem:
        patterns:
          - 'webpack'
          - 'webpack-cli'
          - 'webpack-dev-server'
          - 'html-webpack-plugin'
          - 'copy-webpack-plugin'
          - 'style-loader'
          - 'css-loader'
          - 'babel-loader'

      babel-ecosystem:
        patterns:
          - '@babel/*'

      npm-dev:
        dependency-type: development
        update-types:
          - minor
          - patch

      npm-prod:
        dependency-type: production
        update-types:
          - minor
          - patch
